<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>New password</title>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>

<div class="auth-container">

    <div class="card auth-box">

        <h2>New password</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save new password
            </button>

        </form>

    </div>

</div>

</body>
</html>
