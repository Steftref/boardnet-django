{% extends 'app/baseUser.html' %}

{% block content %}

<div class="container tools-page">

    <h1 class="page-title">Tools</h1>


    <div class="tools-layout">

        <div class="tools-sidebar">
            <div class="tool-card" onclick="showTool('dice', event)">Dice</div>
            <div class="tool-card" onclick="showTool('random', event)">Random number</div>
            <div class="tool-card" onclick="showTool('picker', event)">Picker</div>
            <div class="tool-card" onclick="showTool('timer', event)">Timer/Stopwatch</div>
        </div>

        <div id="toolView" class="tool-view card">
            <h2>Choose a tool</h2>
        </div>

    </div>


</div>

{% endblock %}
