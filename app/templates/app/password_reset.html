<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Password reset</title>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>

<div class="navbar">
    <div class="logo">BoardNet</div>
</div>

<div class="auth-container">

    <div class="card auth-box">

        <h2>Password reset</h2>

        <p>Enter the e-mail address you registered with.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.email }}

            <button type="submit">
                Send link
            </button>
        </form>

    </div>

</div>

</body>
</html>
